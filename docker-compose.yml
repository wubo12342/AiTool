services:
  # 資料庫服務
  db:
    image: mariadb:10.6
    container_name: aitool-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-ai_tools}
    ports:
      - "3307:3306" # 映射 3307 以免跟你本機的 MySQL (3306) 衝突
    volumes:
      - db_data:/var/lib/mysql
      # 自動初始化資料庫：將你的 SQL 放到這個目錄
      - ./sql/ai_tools.sql:/docker-entrypoint-initdb.d/init.sql

  # PHP 後端服務
  app:
    build: .
    container_name: aitool-app
    restart: always
    ports:
      - "8081:80" # 映射 8081 以免跟你本機的 Apache (8080) 衝突
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ai_tools}
      DB_USER: root
      DB_PASS: ${DB_PASS:-root}
    depends_on:
      - db

  # Vite 前端服務
  frontend:
    image: node:20
    container_name: aitool-frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app

volumes:
  db_data:
